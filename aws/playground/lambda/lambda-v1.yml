AWSTemplateFormatVersion: 2010-09-09
Description: "Sample Lambda function using CFN"

Parameters:
  functionName:
    Description: "The Lambda Function Name"
    Type: String
    Default: "fnHelloWorldCfn"
Resources:
  FnHelloWorld:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: "fca-trn-cfn-scripts"
        S3Key: "lambda/fnHello-v0.zip"
      Description: "Sample Lambda function using CFN"
      FunctionName: !Ref functionName
      Handler: "fnHello.Handler"
      # Role: "arn:aws:iam::486295460984:role/service-role/fnHelloWorld-role-kysgpsuv"
      Role: !GetAtt lambdaFunctionRole.Arn
      Runtime: "python3.12"
      Timeout: 60

  lambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17" 
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Description: !Join [ "", [ "IAM Role for", !Ref functionName, "lambda function" ] ]
      RoleName: !Join [ "-", [ !Ref functionName, "lambda", "role" ] ] # this is just the name
      Policies:
        - PolicyName: !Join [ "-", [ !Ref functionName, "execution", "policy" ] ]
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogGroup"
                Resource:
                  - "arn:aws:logs:*:*:*"

              - Effect: "Allow"
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Join [ "", [ "arn:aws:logs:*:*:log-group:/aws/lambda/", !Ref functionName, ":*" ] ]
